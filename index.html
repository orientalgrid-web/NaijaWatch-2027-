<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaijaWatch 2027 — Citizen Collation &amp; Verification Portal</title>
  <style>
    :root {
      --bg: #07130d;
      --surface: #0e2118;
      --surface-2: #142f22;
      --border: #254d39;
      --text: #eef7f1;
      --muted: #9eb8a8;
      --green: #16a34a;
      --green-bright: #22c55e;
      --gold: #eab308;
      --red: #ef4444;
      --blue: #38bdf8;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #113021, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .topbar {
      background: rgba(9, 24, 17, 0.94);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-flag {
      display: grid;
      grid-template-columns: repeat(3, 8px);
      height: 28px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .brand-flag span:nth-child(odd) { background: #16a34a; }
    .brand-flag span:nth-child(even) { background: #ffffff; }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand p {
      font-size: 0.76rem;
      color: var(--muted);
    }

    .owner-banner {
      margin-top: 0.55rem;
      padding-top: 0.5rem;
      border-top: 1px dashed rgba(158, 184, 168, 0.25);
      font-size: 0.75rem;
      color: #d8efe2;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: space-between;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green-bright);
    }

    .dot.offline { background: var(--gold); }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      padding: 0.52rem 0.85rem;
      border-radius: 8px;
      font-size: 0.84rem;
      font-weight: 600;
      transition: 0.15s ease;
    }

    button:hover:not(:disabled) {
      border-color: var(--green-bright);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--green);
      border-color: var(--green-bright);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--green-bright);
      color: #041209;
    }

    button.situation-btn {
      background: linear-gradient(135deg, #1d4ed8, #6d28d9);
      border-color: #818cf8;
      color: #fff;
    }

    button.warn {
      background: rgba(234, 179, 8, 0.15);
      border-color: var(--gold);
      color: #fde047;
    }

    .container {
      max-width: 1180px;
      margin: 1.25rem auto;
      padding: 0 1rem 3rem;
    }

    body.desktop-mode .container {
      max-width: 1540px;
    }

    body.desktop-mode .desktop-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      gap: 1.25rem;
      align-items: start;
    }

    .situation-rail {
      display: none;
    }

    body.desktop-mode .situation-rail {
      display: block;
      position: sticky;
      top: 84px;
    }

    .gate-banner {
      background: linear-gradient(135deg, rgba(22, 163, 74, 0.16), rgba(14, 33, 24, 0.96));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.15rem;
      margin-bottom: 1.15rem;
